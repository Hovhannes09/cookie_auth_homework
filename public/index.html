<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Dashboard</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--bg: #0f0f12;
				--surface: #18181f;
				--border: #2a2a35;
				--accent: #7c6dfa;
				--accent2: #fa6d9a;
				--text: #e8e8f0;
				--muted: #6b6b80;
				--success: #4ade80;
				--danger: #f87171;
				--radius: 12px;
				--font-mono: 'Space Mono', monospace;
				--font-body: 'DM Sans', sans-serif;
			}

			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--font-body);
				font-size: 15px;
				min-height: 100vh;
			}

			/* ── LAYOUT ── */
			#app {
				display: flex;
				min-height: 100vh;
			}

			/* ── SIDEBAR ── */
			#sidebar {
				width: 220px;
				background: var(--surface);
				border-right: 1px solid var(--border);
				display: flex;
				flex-direction: column;
				padding: 24px 16px;
				gap: 4px;
				position: sticky;
				top: 0;
				height: 100vh;
			}
			.logo {
				font-family: var(--font-mono);
				font-size: 13px;
				color: var(--accent);
				letter-spacing: 2px;
				text-transform: uppercase;
				padding: 0 8px 24px;
				border-bottom: 1px solid var(--border);
				margin-bottom: 16px;
			}
			.nav-btn {
				background: none;
				border: none;
				color: var(--muted);
				font-family: var(--font-body);
				font-size: 14px;
				font-weight: 500;
				padding: 10px 12px;
				border-radius: 8px;
				cursor: pointer;
				text-align: left;
				transition: all 0.15s;
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.nav-btn:hover {
				background: var(--border);
				color: var(--text);
			}
			.nav-btn.active {
				background: rgba(124, 109, 250, 0.15);
				color: var(--accent);
			}
			.nav-btn .icon {
				font-size: 16px;
				width: 20px;
				text-align: center;
			}

			#sidebar-footer {
				margin-top: auto;
			}
			#logout-btn {
				width: 100%;
				background: none;
				border: 1px solid var(--border);
				color: var(--muted);
				padding: 9px 12px;
				border-radius: 8px;
				cursor: pointer;
				font-family: var(--font-body);
				font-size: 13px;
				transition: all 0.15s;
			}
			#logout-btn:hover {
				border-color: var(--danger);
				color: var(--danger);
			}
			#user-info {
				font-size: 12px;
				color: var(--muted);
				padding: 8px 12px;
				margin-bottom: 8px;
			}
			#user-info span {
				color: var(--text);
				font-weight: 500;
			}

			/* ── MAIN ── */
			#main {
				flex: 1;
				padding: 32px;
				overflow-y: auto;
			}

			/* ── PAGES ── */
			.page {
				display: none;
			}
			.page.active {
				display: block;
				animation: fadeIn 0.2s ease;
			}
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* ── AUTH PAGE ── */
			#auth-page {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				background: var(--bg);
			}
			.auth-box {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 40px;
				width: 100%;
				max-width: 380px;
			}
			.auth-box h2 {
				font-family: var(--font-mono);
				font-size: 20px;
				margin-bottom: 8px;
				color: var(--text);
			}
			.auth-box p {
				color: var(--muted);
				font-size: 13px;
				margin-bottom: 28px;
			}
			.auth-tabs {
				display: flex;
				gap: 8px;
				margin-bottom: 24px;
			}
			.auth-tab {
				flex: 1;
				padding: 8px;
				border: 1px solid var(--border);
				background: none;
				color: var(--muted);
				border-radius: 8px;
				cursor: pointer;
				font-family: var(--font-body);
				font-size: 13px;
				font-weight: 500;
				transition: all 0.15s;
			}
			.auth-tab.active {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}

			/* ── FORMS ── */
			.field {
				margin-bottom: 16px;
			}
			.field label {
				display: block;
				font-size: 12px;
				color: var(--muted);
				margin-bottom: 6px;
				font-weight: 500;
				letter-spacing: 0.5px;
				text-transform: uppercase;
			}
			.field input {
				width: 100%;
				background: var(--bg);
				border: 1px solid var(--border);
				color: var(--text);
				padding: 10px 14px;
				border-radius: 8px;
				font-family: var(--font-body);
				font-size: 14px;
				outline: none;
				transition: border-color 0.15s;
			}
			.field input:focus {
				border-color: var(--accent);
			}

			.btn {
				padding: 10px 20px;
				border-radius: 8px;
				border: none;
				cursor: pointer;
				font-family: var(--font-body);
				font-size: 14px;
				font-weight: 500;
				transition: all 0.15s;
			}
			.btn-primary {
				background: var(--accent);
				color: #fff;
			}
			.btn-primary:hover {
				opacity: 0.85;
			}
			.btn-danger {
				background: rgba(248, 113, 113, 0.15);
				color: var(--danger);
				border: 1px solid rgba(248, 113, 113, 0.3);
			}
			.btn-danger:hover {
				background: rgba(248, 113, 113, 0.25);
			}
			.btn-sm {
				padding: 6px 12px;
				font-size: 12px;
			}
			.btn-full {
				width: 100%;
			}

			/* ── PAGE HEADER ── */
			.page-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 28px;
			}
			.page-header h1 {
				font-size: 22px;
				font-weight: 600;
			}
			.page-header p {
				color: var(--muted);
				font-size: 13px;
				margin-top: 2px;
			}

			/* ── CARD / TABLE ── */
			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				overflow: hidden;
				margin-bottom: 24px;
			}
			.card-head {
				padding: 16px 20px;
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.card-head h3 {
				font-size: 14px;
				font-weight: 600;
			}

			table {
				width: 100%;
				border-collapse: collapse;
			}
			th {
				padding: 10px 16px;
				text-align: left;
				font-size: 11px;
				font-weight: 600;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.8px;
				background: rgba(255, 255, 255, 0.02);
				border-bottom: 1px solid var(--border);
			}
			td {
				padding: 12px 16px;
				font-size: 13px;
				border-bottom: 1px solid var(--border);
				vertical-align: middle;
			}
			tr:last-child td {
				border-bottom: none;
			}
			tr:hover td {
				background: rgba(255, 255, 255, 0.02);
			}

			/* ── INLINE FORM ── */
			.inline-form {
				display: flex;
				gap: 10px;
				padding: 16px 20px;
				border-top: 1px solid var(--border);
				flex-wrap: wrap;
			}
			.inline-form input {
				flex: 1;
				min-width: 120px;
				background: var(--bg);
				border: 1px solid var(--border);
				color: var(--text);
				padding: 8px 12px;
				border-radius: 8px;
				font-family: var(--font-body);
				font-size: 13px;
				outline: none;
			}
			.inline-form input:focus {
				border-color: var(--accent);
			}
			.inline-form input::placeholder {
				color: var(--muted);
			}

			/* ── BADGE ── */
			.badge {
				display: inline-block;
				padding: 2px 8px;
				border-radius: 20px;
				font-size: 11px;
				font-weight: 600;
				background: rgba(124, 109, 250, 0.15);
				color: var(--accent);
			}

			/* ── TOAST ── */
			#toast {
				position: fixed;
				bottom: 24px;
				right: 24px;
				padding: 12px 20px;
				border-radius: 10px;
				font-size: 13px;
				font-weight: 500;
				transform: translateY(80px);
				opacity: 0;
				transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
				z-index: 1000;
				pointer-events: none;
			}
			#toast.show {
				transform: translateY(0);
				opacity: 1;
			}
			#toast.success {
				background: rgba(74, 222, 128, 0.15);
				color: var(--success);
				border: 1px solid rgba(74, 222, 128, 0.3);
			}
			#toast.error {
				background: rgba(248, 113, 113, 0.15);
				color: var(--danger);
				border: 1px solid rgba(248, 113, 113, 0.3);
			}

			/* ── EMPTY STATE ── */
			.empty {
				padding: 40px;
				text-align: center;
				color: var(--muted);
				font-size: 13px;
			}

			/* ── LOADING ── */
			.loading {
				padding: 40px;
				text-align: center;
				color: var(--muted);
				font-size: 13px;
			}
			.spinner {
				width: 20px;
				height: 20px;
				border: 2px solid var(--border);
				border-top-color: var(--accent);
				border-radius: 50%;
				animation: spin 0.6s linear infinite;
				display: inline-block;
				margin-bottom: 8px;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<!-- AUTH PAGE -->
		<div id="auth-page">
			<div class="auth-box">
				<h2>// Dashboard</h2>
				<p>Войди чтобы продолжить</p>
				<div class="auth-tabs">
					<button
						class="auth-tab active"
						onclick="switchTab('login')"
					>
						Войти
					</button>
					<button
						class="auth-tab"
						onclick="switchTab('register')"
					>
						Регистрация
					</button>
				</div>

				<!-- Login Form -->
				<div id="login-form">
					<div class="field">
						<label>Email</label>
						<input
							type="email"
							id="login-email"
							placeholder="you@example.com"
						/>
					</div>
					<div class="field">
						<label>Пароль</label>
						<input
							type="password"
							id="login-password"
							placeholder="••••••••"
						/>
					</div>
					<button
						class="btn btn-primary btn-full"
						onclick="login()"
					>
						Войти
					</button>
				</div>

				<!-- Register Form -->
				<div
					id="register-form"
					style="display: none"
				>
					<div class="field">
						<label>Имя</label>
						<input
							type="text"
							id="reg-name"
							placeholder="Aram"
						/>
					</div>
					<div class="field">
						<label>Email</label>
						<input
							type="email"
							id="reg-email"
							placeholder="you@example.com"
						/>
					</div>
					<div class="field">
						<label>Пароль</label>
						<input
							type="password"
							id="reg-password"
							placeholder="••••••••"
						/>
					</div>
					<button
						class="btn btn-primary btn-full"
						onclick="register()"
					>
						Зарегистрироваться
					</button>
				</div>
			</div>
		</div>

		<!-- DASHBOARD -->
		<div
			id="dashboard"
			style="display: none"
		>
			<div id="app">
				<!-- Sidebar -->
				<nav id="sidebar">
					<div class="logo">⬡ Panel</div>
					<button
						class="nav-btn active"
						onclick="showPage('customers')"
						data-page="customers"
					>
						<span class="icon">👥</span>
						Customers
					</button>
					<button
						class="nav-btn"
						onclick="showPage('persons')"
						data-page="persons"
					>
						<span class="icon">🧑</span>
						Persons
					</button>
					<button
						class="nav-btn"
						onclick="showPage('orders')"
						data-page="orders"
					>
						<span class="icon">📦</span>
						Orders
					</button>
					<div id="sidebar-footer">
						<div id="user-info">
							Привет,
							<span id="username-display">...</span>
						</div>
						<button
							id="logout-btn"
							onclick="logout()"
						>
							→ Выйти
						</button>
					</div>
				</nav>

				<!-- Main content -->
				<main id="main">
					<!-- CUSTOMERS PAGE -->
					<div
						class="page active"
						id="page-customers"
					>
						<div class="page-header">
							<div>
								<h1>Customers</h1>
								<p>Список всех клиентов</p>
							</div>
						</div>
						<div class="card">
							<div class="card-head">
								<h3>Все клиенты</h3>
								<button
									class="btn btn-sm"
									onclick="loadCustomers()"
									style="background: var(--border); color: var(--text)"
								>
									↺ Обновить
								</button>
							</div>
							<div id="customers-table">
								<div class="loading">
									<div class="spinner"></div>
									<br />
									Загрузка...
								</div>
							</div>
							<div class="inline-form">
								<input
									id="c-name"
									placeholder="CustomerName *"
								/>
								<input
									id="c-city"
									placeholder="City *"
								/>
								<input
									id="c-last"
									placeholder="last_name (необязательно)"
								/>
								<button
									class="btn btn-primary"
									onclick="createCustomer()"
								>
									+ Добавить
								</button>
							</div>
						</div>
					</div>

					<!-- PERSONS PAGE -->
					<div
						class="page"
						id="page-persons"
					>
						<div class="page-header">
							<div>
								<h1>Persons</h1>
								<p>Список всех персон</p>
							</div>
						</div>
						<div class="card">
							<div class="card-head">
								<h3>Все персоны</h3>
								<button
									class="btn btn-sm"
									onclick="loadPersons()"
									style="background: var(--border); color: var(--text)"
								>
									↺ Обновить
								</button>
							</div>
							<div id="persons-table">
								<div class="loading">
									<div class="spinner"></div>
									<br />
									Загрузка...
								</div>
							</div>
							<div class="inline-form">
								<input
									id="p-first"
									placeholder="FirstName *"
								/>
								<input
									id="p-last"
									placeholder="LastName *"
								/>
								<button
									class="btn btn-primary"
									onclick="createPerson()"
								>
									+ Добавить
								</button>
							</div>
						</div>
					</div>

					<!-- ORDERS PAGE -->
					<div
						class="page"
						id="page-orders"
					>
						<div class="page-header">
							<div>
								<h1>Orders</h1>
								<p>Список всех заказов</p>
							</div>
						</div>
						<div class="card">
							<div class="card-head">
								<h3>Все заказы</h3>
								<button
									class="btn btn-sm"
									onclick="loadOrders()"
									style="background: var(--border); color: var(--text)"
								>
									↺ Обновить
								</button>
							</div>
							<div id="orders-table">
								<div class="loading">
									<div class="spinner"></div>
									<br />
									Загрузка...
								</div>
							</div>
							<div class="inline-form">
								<input
									id="o-number"
									placeholder="OrderNumber *"
									type="number"
								/>
								<input
									id="o-person"
									placeholder="PersonID *"
									type="number"
								/>
								<button
									class="btn btn-primary"
									onclick="createOrder()"
								>
									+ Добавить
								</button>
							</div>
						</div>
					</div>
				</main>
			</div>
		</div>

		<!-- Toast уведомление -->
		<div id="toast"></div>

		<script>
			// ──────────────────────────────────────────
			//  НАСТРОЙКИ
			// ──────────────────────────────────────────
			const API = 'http://localhost:3000' // ← поменяй если другой порт

			// ──────────────────────────────────────────
			//  TOAST — показывает уведомления внизу
			// ──────────────────────────────────────────
			function toast(msg, type = 'success') {
				const t = document.getElementById('toast')
				t.textContent = msg
				t.className = `show ${type}`
				setTimeout(() => (t.className = ''), 3000)
			}

			// ──────────────────────────────────────────
			//  API HELPER — все запросы через эту функцию
			//  credentials: 'include' — отправляет cookie с каждым запросом
			// ──────────────────────────────────────────
			async function api(method, path, body) {
				const res = await fetch(API + path, {
					method,
					headers: { 'Content-Type': 'application/json' },
					credentials: 'include', // важно! без этого cookie не отправится
					body: body ? JSON.stringify(body) : undefined
				})
				const data = await res.json().catch(() => ({}))
				if (!res.ok) throw new Error(data.message || 'Ошибка')
				return data
			}

			// ──────────────────────────────────────────
			//  AUTH TABS — переключение Войти / Регистрация
			// ──────────────────────────────────────────
			function switchTab(tab) {
				document.getElementById('login-form').style.display =
					tab === 'login' ? '' : 'none'
				document.getElementById('register-form').style.display =
					tab === 'register' ? '' : 'none'
				document.querySelectorAll('.auth-tab').forEach((b, i) => {
					b.classList.toggle(
						'active',
						(tab === 'login' && i === 0) || (tab === 'register' && i === 1)
					)
				})
			}

			// ──────────────────────────────────────────
			//  LOGIN — POST /auth/login
			// ──────────────────────────────────────────
			async function login() {
				try {
					const email = document.getElementById('login-email').value
					const password = document.getElementById('login-password').value
					await api('POST', '/auth/login', { email, password })
					showDashboard()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// ──────────────────────────────────────────
			//  REGISTER — POST /auth/register
			// ──────────────────────────────────────────
			async function register() {
				try {
					const name = document.getElementById('reg-name').value
					const email = document.getElementById('reg-email').value
					const password = document.getElementById('reg-password').value
					await api('POST', '/auth/register', { name, email, password })
					toast('Зарегистрирован! Войди.')
					switchTab('login')
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// ──────────────────────────────────────────
			//  LOGOUT — POST /auth/logout
			// ──────────────────────────────────────────
			async function logout() {
				try {
					await api('POST', '/auth/logout')
				} finally {
					document.getElementById('dashboard').style.display = 'none'
					document.getElementById('auth-page').style.display = 'flex'
				}
			}

			// ──────────────────────────────────────────
			//  SHOW DASHBOARD — показывает панель и загружает данные
			// ──────────────────────────────────────────
			async function showDashboard() {
				document.getElementById('auth-page').style.display = 'none'
				document.getElementById('dashboard').style.display = 'flex'
				// Загружаем имя пользователя
				try {
					const { user: me } = await api('GET', '/auth/me')
					document.getElementById('username-display').textContent =
						me.name || me.email
				} catch {}
				loadCustomers()
			}

			// ──────────────────────────────────────────
			//  НАВИГАЦИЯ — переключение страниц
			// ──────────────────────────────────────────
			function showPage(name) {
				document
					.querySelectorAll('.page')
					.forEach(p => p.classList.remove('active'))
				document
					.querySelectorAll('.nav-btn')
					.forEach(b => b.classList.remove('active'))
				document.getElementById(`page-${name}`).classList.add('active')
				document.querySelector(`[data-page="${name}"]`).classList.add('active')
				// Загружаем данные при переходе
				if (name === 'customers') loadCustomers()
				if (name === 'persons') loadPersons()
				if (name === 'orders') loadOrders()
			}

			// ──────────────────────────────────────────
			//  CUSTOMERS — GET /customers
			// ──────────────────────────────────────────
			async function loadCustomers() {
				const el = document.getElementById('customers-table')
				el.innerHTML =
					'<div class="loading"><div class="spinner"></div><br>Загрузка...</div>'
				try {
					const { customers: data } = await api('GET', '/customers')
					if (!data.length) {
						el.innerHTML = '<div class="empty">Нет клиентов</div>'
						return
					}
					el.innerHTML = `
        <table>
          <thead><tr><th>ID</th><th>Имя</th><th>Город</th><th>Фамилия</th><th></th></tr></thead>
          <tbody>
            ${data
							.map(
								c => `
              <tr>
                <td><span class="badge">#${c.CustomerID}</span></td>
                <td>${c.CustomerName}</td>
                <td>${c.City}</td>
                <td>${c.last_name || '—'}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteCustomer(${c.CustomerID})">Удалить</button></td>
              </tr>`
							)
							.join('')}
          </tbody>
        </table>`
				} catch (e) {
					el.innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`
				}
			}

			// POST /customers
			async function createCustomer() {
				try {
					const CustomerName = document.getElementById('c-name').value.trim()
					const City = document.getElementById('c-city').value.trim()
					const last_name = document.getElementById('c-last').value.trim()
					if (!CustomerName || !City) {
						toast('Заполни имя и город', 'error')
						return
					}
					await api('POST', '/customers', {
						CustomerName,
						City,
						last_name: last_name || undefined
					})
					document.getElementById('c-name').value = ''
					document.getElementById('c-city').value = ''
					document.getElementById('c-last').value = ''
					toast('Клиент добавлен!')
					loadCustomers()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// DELETE /customers/:id
			async function deleteCustomer(id) {
				try {
					await api('DELETE', `/customers/${id}`)
					toast('Клиент удалён')
					loadCustomers()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// ──────────────────────────────────────────
			//  PERSONS — GET /persons
			// ──────────────────────────────────────────
			async function loadPersons() {
				const el = document.getElementById('persons-table')
				el.innerHTML =
					'<div class="loading"><div class="spinner"></div><br>Загрузка...</div>'
				try {
					const { persons: data } = await api('GET', '/persons')
					if (!data.length) {
						el.innerHTML = '<div class="empty">Нет персон</div>'
						return
					}
					el.innerHTML = `
        <table>
          <thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th></th></tr></thead>
          <tbody>
            ${data
							.map(
								p => `
              <tr>
                <td><span class="badge">#${p.PersonID}</span></td>
                <td>${p.FirstName}</td>
                <td>${p.LastName}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deletePerson(${p.PersonID})">Удалить</button></td>
              </tr>`
							)
							.join('')}
          </tbody>
        </table>`
				} catch (e) {
					el.innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`
				}
			}

			// POST /persons
			async function createPerson() {
				try {
					const FirstName = document.getElementById('p-first').value.trim()
					const LastName = document.getElementById('p-last').value.trim()
					if (!FirstName || !LastName) {
						toast('Заполни имя и фамилию', 'error')
						return
					}
					await api('POST', '/persons', { FirstName, LastName })
					document.getElementById('p-first').value = ''
					document.getElementById('p-last').value = ''
					toast('Персона добавлена!')
					loadPersons()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// DELETE /persons/:id
			async function deletePerson(id) {
				try {
					await api('DELETE', `/persons/${id}`)
					toast('Персона удалена (и её заказы тоже)')
					loadPersons()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// ──────────────────────────────────────────
			//  ORDERS — GET /persons/orders
			// ──────────────────────────────────────────
			async function loadOrders() {
				const el = document.getElementById('orders-table')
				el.innerHTML =
					'<div class="loading"><div class="spinner"></div><br>Загрузка...</div>'
				try {
					const { orders: data } = await api('GET', '/persons/orders')
					if (!data.length) {
						el.innerHTML = '<div class="empty">Нет заказов</div>'
						return
					}
					el.innerHTML = `
        <table>
          <thead><tr><th>ID</th><th>Номер заказа</th><th>Персона</th><th></th></tr></thead>
          <tbody>
            ${data
							.map(
								o => `
              <tr>
                <td><span class="badge">#${o.OrderID}</span></td>
                <td>${o.OrderNumber}</td>
                <td>${o.Person ? o.Person.FirstName + ' ' + o.Person.LastName : '—'}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.OrderID})">Удалить</button></td>
              </tr>`
							)
							.join('')}
          </tbody>
        </table>`
				} catch (e) {
					el.innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`
				}
			}

			// POST /persons/orders
			async function createOrder() {
				try {
					const OrderNumber = parseInt(
						document.getElementById('o-number').value
					)
					const PersonID = parseInt(document.getElementById('o-person').value)
					if (!OrderNumber || !PersonID) {
						toast('Заполни оба поля', 'error')
						return
					}
					await api('POST', '/persons/orders', { OrderNumber, PersonID })
					document.getElementById('o-number').value = ''
					document.getElementById('o-person').value = ''
					toast('Заказ добавлен!')
					loadOrders()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// DELETE /persons/orders/:id
			async function deleteOrder(id) {
				try {
					await api('DELETE', `/persons/orders/${id}`)
					toast('Заказ удалён')
					loadOrders()
				} catch (e) {
					toast(e.message, 'error')
				}
			}

			// ──────────────────────────────────────────
			//  СТАРТ — проверяем авторизован ли пользователь
			// ──────────────────────────────────────────
			;(async () => {
				try {
					await api('GET', '/auth/me')
					showDashboard()
				} catch {
					// не авторизован — показываем login
				}
			})()
		</script>
	</body>
</html>
